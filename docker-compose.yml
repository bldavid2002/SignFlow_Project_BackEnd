version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: signflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" 
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: