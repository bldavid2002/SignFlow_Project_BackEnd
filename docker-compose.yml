version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: signflow-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: signflow_db
    ports:
      - "5433:5432" 
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: